# AndroidX migration
android.useAndroidX=true

# Disable transitive R class generation for faster builds
android.nonTransitiveRClass=true

# Gradle JVM heap size & encoding
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# Disable VFS watching to prevent OneDrive file locking conflicts on Windows
org.gradle.vfs.watch=false

